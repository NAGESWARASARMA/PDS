{% extends "base.html" %}{% block title %}Profile{% endblock %}{% block content %}<section class="page-heading"><span class="eyebrow">YOUR ACCOUNT</span><h1>{{ user.username }}'s profile</h1></section><div class="stats-grid"><div class="stat"><span>Problems deployed</span><strong>{{ stats.deployed }}</strong></div><div class="stat"><span>Solutions submitted</span><strong>{{ stats.solutions }}</strong></div><div class="stat"><span>Accepted solutions</span><strong>{{ stats.accepted }}</strong></div></div><form method="post" class="panel form-stack"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label for="bio">About you</label><textarea id="bio" name="bio" rows="4" maxlength="500">{{ user.bio }}</textarea><button class="button" type="submit">Save profile</button></form>{% endblock %}
